  <div class="tl1">Por que o</div><div class="tl2">SUBARU</div><div class="tl1">não pode contar que</div><div class="tl3">VOLTA DA MORTE?</div></div>
<div id="cap0" class="clip cap" data-start="8.64" data-duration="2.60">— VOLTAR DA MORTE —</div>
<div id="cap1" class="clip cap" data-start="19.52" data-duration="2.60">— A MÃO —</div>
<div id="cap2" class="clip cap" data-start="30.60" data-duration="2.60">— O PREÇO —</div>
<div id="cap3" class="clip cap" data-start="38.48" data-duration="2.60">— A BRUXA —</div>
<div id="cap4" class="clip cap" data-start="51.58" data-duration="2.60">— A EXCEÇÃO —</div>
<div id="cap5" class="clip cap" data-start="64.20" data-duration="2.60">— SÓ DELE —</div>
<div id="lg1" class="clip leg" data-start="2.24" data-duration="0.76" style="top:250px"><div class="mancha"></div><div class="lt">e acordar de novo,</div></div>
<div id="lg2" class="clip leg" data-start="3.05" data-duration="1.13" style="top:250px"><div class="mancha"></div><div class="lt">minutos antes.</div></div>
<div id="lg3" class="clip leg" data-start="4.23" data-duration="1.89" style="top:250px"><div class="mancha"></div><div class="lt">E não poder contar isso pra ninguém.</div></div>
<div id="lg4" class="clip leg" data-start="6.17" data-duration="1.99" style="top:250px"><div class="mancha"></div><div class="lt">Nem pra quem você mais ama.</div></div>
<div id="lg5" class="clip leg" data-start="8.74" data-duration="2.22" style="top:330px"><div class="mancha"></div><div class="lt">O Subaru Natsuki caiu em outro mundo</div></div>
<div id="lg6" class="clip leg" data-start="11.01" data-duration="1.29" style="top:330px"><div class="mancha"></div><div class="lt">com um único poder:</div></div>
<div id="lg7" class="clip leg" data-start="12.35" data-duration="1.34" style="top:250px"><div class="mancha"></div><div class="lt">quando morre, ele volta no tempo.</div></div>
<div id="lg8" class="clip leg" data-start="13.74" data-duration="1.38" style="top:250px"><div class="mancha"></div><div class="lt">Ele lembra de tudo.</div></div>
<div id="lg9" class="clip leg" data-start="15.17" data-duration="0.88" style="top:250px"><div class="mancha"></div><div class="lt">Os outros, não.</div></div>
<div id="lg10" class="clip leg" data-start="16.10" data-duration="1.91" style="top:250px"><div class="mancha"></div><div class="lt">Pra eles, aquilo nunca aconteceu.</div></div>
<div id="lg11" class="clip leg" data-start="19.62" data-duration="2.39" style="top:330px"><div class="mancha"></div><div class="lt">Na primeira vez que ele tentou contar pra Emilia,</div></div>
<div id="lg12" class="clip leg" data-start="22.06" data-duration="0.31" style="top:330px"><div class="mancha"></div><div class="lt">o tempo parou.</div></div>
<div id="lg13" class="clip leg" data-start="22.42" data-duration="1.23" style="top:250px"><div class="mancha"></div><div class="lt">O mundo ficou cinza.</div></div>
<div id="lg14" class="clip leg" data-start="23.77" data-duration="2.16" style="top:250px"><div class="mancha"></div><div class="lt">E uma mão de sombra entrou no peito dele...</div></div>
<div id="lg15" class="clip leg" data-start="25.98" data-duration="0.69" style="top:250px"><div class="mancha"></div><div class="lt">e apertou o coração.</div></div>
<div id="lg16" class="clip leg" data-start="26.72" data-duration="1.91" style="top:250px"><div class="mancha"></div><div class="lt">Toda vez que ele tenta,</div></div>
<div id="lg17" class="clip leg" data-start="28.68" data-duration="1.33" style="top:250px"><div class="mancha"></div><div class="lt">a mão volta.</div></div>
<div id="lg18" class="clip leg" data-start="30.70" data-duration="0.73" style="top:330px"><div class="mancha"></div><div class="lt">E piora.</div></div>
<div id="lg19" class="clip leg" data-start="31.48" data-duration="1.84" style="top:330px"><div class="mancha"></div><div class="lt">Às vezes a mão não aperta o coração dele.</div></div>
<div id="lg20" class="clip leg" data-start="33.36" data-duration="1.12" style="top:250px"><div class="mancha"></div><div class="lt">Aperta o de quem está ouvindo.</div></div>
<div id="lg21" class="clip leg" data-start="34.53" data-duration="0.99" style="top:250px"><div class="mancha"></div><div class="lt">Numa das voltas,</div></div>
<div id="lg22" class="clip leg" data-start="35.57" data-duration="2.09" style="top:250px"><div class="mancha"></div><div class="lt">quem morreu foi a Emilia.</div></div>
<div id="lg23" class="clip leg" data-start="38.58" data-duration="2.00" style="top:330px"><div class="mancha"></div><div class="lt">Essa mão é da Bruxa da Inveja,</div></div>
<div id="lg24" class="clip leg" data-start="40.63" data-duration="0.82" style="top:330px"><div class="mancha"></div><div class="lt">a Satella.</div></div>
<div id="lg25" class="clip leg" data-start="41.50" data-duration="1.48" style="top:250px"><div class="mancha"></div><div class="lt">A teoria mais aceita é simples:</div></div>
<div id="lg26" class="clip leg" data-start="43.14" data-duration="0.39" style="top:250px"><div class="mancha"></div><div class="lt">inveja.</div></div>
<div id="lg27" class="clip leg" data-start="43.58" data-duration="2.01" style="top:250px"><div class="mancha"></div><div class="lt">Ela não quer dividir o Subaru com ninguém.</div></div>
<div id="lg28" class="clip leg" data-start="45.64" data-duration="2.34" style="top:250px"><div class="mancha"></div><div class="lt">Só ela pode saber o que ele carrega.</div></div>
<div id="lg29" class="clip leg" data-start="48.68" data-duration="1.51" style="top:250px"><div class="mancha"></div><div class="lt">Quer aprender a fazer esses vídeos?</div></div>
<div id="lg30" class="clip leg" data-start="50.24" data-duration="1.39" style="top:250px"><div class="mancha"></div><div class="lt">Link do meu Discord na bio.</div></div>
<div id="lg31" class="clip leg" data-start="51.68" data-duration="2.07" style="top:330px"><div class="mancha"></div><div class="lt">Só uma pessoa conseguiu ouvir:</div></div>
<div id="lg32" class="clip leg" data-start="53.80" data-duration="1.35" style="top:330px"><div class="mancha"></div><div class="lt">a Echidna, a Bruxa da Ganância.</div></div>
<div id="lg33" class="clip leg" data-start="55.20" data-duration="1.75" style="top:250px"><div class="mancha"></div><div class="lt">No castelo dos sonhos dela,</div></div>
<div id="lg34" class="clip leg" data-start="57.00" data-duration="1.36" style="top:250px"><div class="mancha"></div><div class="lt">longe do alcance da Satella,</div></div>
<div id="lg35" class="clip leg" data-start="58.41" data-duration="1.99" style="top:250px"><div class="mancha"></div><div class="lt">o Subaru falou pela primeira vez.</div></div>
<div id="lg36" class="clip leg" data-start="60.45" data-duration="1.49" style="top:250px"><div class="mancha"></div><div class="lt">E, pela primeira vez,</div></div>
<div id="lg37" class="clip leg" data-start="61.99" data-duration="1.35" style="top:250px"><div class="mancha"></div><div class="lt">alguém sabia.</div></div>
<div id="lg38" class="clip leg" data-start="64.30" data-duration="1.59" style="top:330px"><div class="mancha"></div><div class="lt">O filósofo Heidegger escreveu</div></div>
<div id="lg39" class="clip leg" data-start="65.94" data-duration="2.51" style="top:330px"><div class="mancha"></div><div class="lt">que ninguém pode morrer no lugar de outra pessoa.</div></div>
<div id="lg40" class="clip leg" data-start="68.50" data-duration="2.61" style="top:250px"><div class="mancha"></div><div class="lt">A morte é a coisa mais sua que existe.</div></div>
<div id="lg41" class="clip leg" data-start="71.16" data-duration="2.23" style="top:250px"><div class="mancha"></div><div class="lt">O Subaru vive isso ao pé da letra:</div></div>
<div id="lg42" class="clip leg" data-start="73.44" data-duration="1.55" style="top:250px"><div class="mancha"></div><div class="lt">ele já morreu dezenas de vezes,</div></div>
<div id="lg43" class="clip leg" data-start="75.04" data-duration="1.54" style="top:250px"><div class="mancha"></div><div class="lt">e cada morte é só dele.</div></div>
<div id="lg44" class="clip leg" data-start="76.63" data-duration="0.68" style="top:250px"><div class="mancha"></div><div class="lt">Ninguém lembra.</div></div>
<div id="lg45" class="clip leg" data-start="77.36" data-duration="1.88" style="top:250px"><div class="mancha"></div><div class="lt">Ninguém sabe o quanto custou.</div></div>
<div id="lg46" class="clip leg" data-start="80.18" data-duration="2.07" style="top:250px"><div class="mancha"></div><div class="lt">Talvez o castigo não seja morrer.</div></div>
<div id="lg47" class="clip leg" data-start="82.30" data-duration="1.55" style="top:250px"><div class="mancha"></div><div class="lt">É salvar todo mundo...</div></div>
<div id="lg48" class="clip leg" data-start="83.90" data-duration="1.36" style="top:250px"><div class="mancha"></div><div class="lt">e continuar sozinho.</div></div>
<div id="lg49" class="clip leg" data-start="85.31" data-duration="1.58" style="top:250px"><div class="mancha"></div><div class="lt">Se você pudesse voltar no tempo,</div></div>
<div id="lg50" class="clip leg" data-start="86.94" data-duration="1.28" style="top:250px"><div class="mancha"></div><div class="lt">mas nunca contar pra ninguém...</div></div>
<div id="lg51" class="clip leg" data-start="88.27" data-duration="0.94" style="top:250px"><div class="mancha"></div><div class="lt">você voltaria?</div></div>
<div id="lg52" class="clip leg" data-start="89.26" data-duration="0.69" style="top:250px"><div class="mancha"></div><div class="lt">Comenta aí,</div></div>
<div id="lg53" class="clip leg" data-start="90.00" data-duration="1.48" style="top:250px"><div class="mancha"></div><div class="lt">e me segue pra mais.</div></div>
