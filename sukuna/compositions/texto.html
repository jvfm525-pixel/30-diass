  <div class="tl1">Por que o</div><div class="tl2">SUKUNA</div><div class="tl1">escolheu o</div><div class="tl3">MEGUMI?</div></div>
<div id="cap0" class="clip cap" data-start="7.67" data-duration="2.60">— O PRIMEIRO OLHAR —</div>
<div id="cap1" class="clip cap" data-start="19.09" data-duration="2.60">— A JAULA —</div>
<div id="cap2" class="clip cap" data-start="28.71" data-duration="2.60">— AS DEZ SOMBRAS —</div>
<div id="cap3" class="clip cap" data-start="48.10" data-duration="2.60">— O PACTO —</div>
<div id="cap4" class="clip cap" data-start="60.25" data-duration="2.60">— O BANHO —</div>
<div id="cap5" class="clip cap" data-start="73.35" data-duration="2.60">— O MANUAL —</div>
<div id="lg2" class="clip leg" data-start="4.82" data-duration="2.58" style="top:250px"><div class="mancha"></div><div class="lt">A resposta começa bem antes do que parece.</div></div>
<div id="lg3" class="clip leg" data-start="7.77" data-duration="2.69" style="top:330px"><div class="mancha"></div><div class="lt">Quando o Sukuna assumiu o Yuji pela primeira vez,</div></div>
<div id="lg4" class="clip leg" data-start="10.51" data-duration="2.03" style="top:250px"><div class="mancha"></div><div class="lt">no reformatório, ele lutou contra o Megumi</div></div>
<div id="lg5" class="clip leg" data-start="12.59" data-duration="2.05" style="top:250px"><div class="mancha"></div><div class="lt">e enxergou ali um potencial enorme.</div></div>
<div id="lg6" class="clip leg" data-start="14.69" data-duration="1.56" style="top:250px"><div class="mancha"></div><div class="lt">A partir desse dia,</div></div>
<div id="lg7" class="clip leg" data-start="16.30" data-duration="2.59" style="top:250px"><div class="mancha"></div><div class="lt">nunca mais tirou os olhos daquele garoto.</div></div>
<div id="lg8" class="clip leg" data-start="19.19" data-duration="1.92" style="top:330px"><div class="mancha"></div><div class="lt">O detalhe é que o corpo do Yuji</div></div>
<div id="lg9" class="clip leg" data-start="21.16" data-duration="1.90" style="top:330px"><div class="mancha"></div><div class="lt">nunca foi uma casa pro Sukuna.</div></div>
<div id="lg10" class="clip leg" data-start="23.11" data-duration="1.28" style="top:250px"><div class="mancha"></div><div class="lt">Era uma jaula.</div></div>
<div id="lg11" class="clip leg" data-start="24.44" data-duration="1.75" style="top:250px"><div class="mancha"></div><div class="lt">O Yuji conseguia prender ele lá dentro,</div></div>
<div id="lg12" class="clip leg" data-start="26.24" data-duration="1.79" style="top:250px"><div class="mancha"></div><div class="lt">e o próprio Sukuna admitiu isso.</div></div>
<div id="lg13" class="clip leg" data-start="28.81" data-duration="1.66" style="top:330px"><div class="mancha"></div><div class="lt">Então, por que logo o Megumi?</div></div>
<div id="lg14" class="clip leg" data-start="30.52" data-duration="1.76" style="top:330px"><div class="mancha"></div><div class="lt">Por causa das Dez Sombras,</div></div>
<div id="lg15" class="clip leg" data-start="32.33" data-duration="2.25" style="top:250px"><div class="mancha"></div><div class="lt">a técnica que nasceu no corpo dele.</div></div>
<div id="lg16" class="clip leg" data-start="34.63" data-duration="1.79" style="top:250px"><div class="mancha"></div><div class="lt">E junto dela vem o Mahoraga,</div></div>
<div id="lg17" class="clip leg" data-start="36.47" data-duration="2.40" style="top:250px"><div class="mancha"></div><div class="lt">o shikigami que se adapta a qualquer ataque.</div></div>
<div id="lg18" class="clip leg" data-start="40.43" data-duration="1.66" style="top:250px"><div class="mancha"></div><div class="lt">Rapidinho: no meu servidor do Discord</div></div>
<div id="lg19" class="clip leg" data-start="42.14" data-duration="2.39" style="top:250px"><div class="mancha"></div><div class="lt">tem keys aleatórias, vários outros itens,</div></div>
<div id="lg20" class="clip leg" data-start="44.58" data-duration="1.73" style="top:250px"><div class="mancha"></div><div class="lt">e eu ainda ensino a fazer vídeos como este.</div></div>
<div id="lg21" class="clip leg" data-start="46.36" data-duration="1.41" style="top:250px"><div class="mancha"></div><div class="lt">O link tá na bio.</div></div>
<div id="lg22" class="clip leg" data-start="48.20" data-duration="1.33" style="top:330px"><div class="mancha"></div><div class="lt">No capítulo 212,</div></div>
<div id="lg23" class="clip leg" data-start="49.58" data-duration="1.58" style="top:330px"><div class="mancha"></div><div class="lt">o Sukuna ativou o pacto de um minuto</div></div>
<div id="lg24" class="clip leg" data-start="51.21" data-duration="1.70" style="top:250px"><div class="mancha"></div><div class="lt">que tinha arrancado do Yuji,</div></div>
<div id="lg25" class="clip leg" data-start="52.96" data-duration="1.13" style="top:250px"><div class="mancha"></div><div class="lt">cortou um dedo</div></div>
<div id="lg26" class="clip leg" data-start="54.14" data-duration="1.42" style="top:250px"><div class="mancha"></div><div class="lt">e obrigou o Megumi a engolir.</div></div>
<div id="lg27" class="clip leg" data-start="55.61" data-duration="2.58" style="top:250px"><div class="mancha"></div><div class="lt">Trocou de corpo como quem muda de casa...</div></div>
<div id="lg28" class="clip leg" data-start="58.24" data-duration="1.04" style="top:250px"><div class="mancha"></div><div class="lt">sem pagar o aluguel.</div></div>
<div id="lg29" class="clip leg" data-start="60.35" data-duration="1.73" style="top:330px"><div class="mancha"></div><div class="lt">Mas, pra não ganhar outra jaula,</div></div>
<div id="lg30" class="clip leg" data-start="62.13" data-duration="2.37" style="top:330px"><div class="mancha"></div><div class="lt">ele precisava afundar a alma do Megumi.</div></div>
<div id="lg31" class="clip leg" data-start="64.55" data-duration="1.88" style="top:250px"><div class="mancha"></div><div class="lt">E escolheu o caminho mais cruel:</div></div>
<div id="lg32" class="clip leg" data-start="66.48" data-duration="1.72" style="top:250px"><div class="mancha"></div><div class="lt">matou a irmã dele, a Tsumiki,</div></div>
<div id="lg33" class="clip leg" data-start="68.25" data-duration="1.42" style="top:250px"><div class="mancha"></div><div class="lt">possuída pela Yorozu,</div></div>
<div id="lg34" class="clip leg" data-start="69.72" data-duration="1.68" style="top:250px"><div class="mancha"></div><div class="lt">usando o corpo do próprio Megumi.</div></div>
<div id="lg35" class="clip leg" data-start="73.45" data-duration="1.72" style="top:330px"><div class="mancha"></div><div class="lt">E pra ele valeu a pena.</div></div>
<div id="lg36" class="clip leg" data-start="75.22" data-duration="1.69" style="top:330px"><div class="mancha"></div><div class="lt">Foi vendo o Mahoraga se adaptar</div></div>
<div id="lg37" class="clip leg" data-start="76.96" data-duration="2.39" style="top:250px"><div class="mancha"></div><div class="lt">que o Sukuna aprendeu a cortar o próprio espaço</div></div>
<div id="lg38" class="clip leg" data-start="79.40" data-duration="1.95" style="top:250px"><div class="mancha"></div><div class="lt">e atravessou o Infinito do Gojo.</div></div>
<div id="lg39" class="clip leg" data-start="81.40" data-duration="0.82" style="top:250px"><div class="mancha"></div><div class="lt">Nas palavras dele:</div></div>
<div id="lg40" class="clip leg" data-start="82.27" data-duration="1.60" style="top:250px"><div class="mancha"></div><div class="lt"><span class="quem">SUKUNA:</span> "eu tinha um ótimo manual".</div></div>
<div id="lg41" class="clip leg" data-start="84.66" data-duration="2.15" style="top:250px"><div class="mancha"></div><div class="lt">O Yuji era a prisão.</div></div>
<div id="lg42" class="clip leg" data-start="86.86" data-duration="1.25" style="top:250px"><div class="mancha"></div><div class="lt">O Megumi foi a chave.</div></div>

<div id="f2" class="clip ficha" data-start="48.18" data-duration="4.79"><div class="fa">Jujutsu Kaisen</div><div class="fo">capítulo 212</div><div class="fn">a troca de corpo</div></div>
