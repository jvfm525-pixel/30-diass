  function hfHash(n) { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); }

  function hfAlive(tl, p, dur, amp) {
    const st = { t: 0 }; amp = amp || 1;
    tl.to(st, { t: dur, duration: dur, ease: 'none', onUpdate: () => {
