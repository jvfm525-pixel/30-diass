  <div class="tl1">Por que o</div><div class="tl2">GRISHA</div><div class="tl3">COMEU</div><div class="tl1">a família real?</div></div>
<div id="cap0" class="clip cap" data-start="6.35" data-duration="2.60">— O DIA DA QUEDA —</div>
<div id="cap1" class="clip cap" data-start="13.11" data-duration="2.60">— A MISSÃO —</div>
<div id="cap2" class="clip cap" style="font-size:34px;letter-spacing:.2em" data-start="19.79" data-duration="2.60">— A RAINHA QUE NÃO LUTOU —</div>
<div id="cap3" class="clip cap" data-start="26.99" data-duration="2.60">— A CAVERNA —</div>
<div id="cap4" class="clip cap" data-start="35.48" data-duration="2.60">— CONDENADO —</div>
<div id="cap5" class="clip cap" data-start="41.79" data-duration="2.60">— QUEM EMPURROU —</div>
<div id="lg1" class="clip leg" data-start="2.00" data-duration="2.52" style="top:250px"><div class="mancha"></div><div class="lt">que fez a pior coisa da vida dele...</div></div>
<div id="lg2" class="clip leg" data-start="4.57" data-duration="1.83" style="top:250px"><div class="mancha"></div><div class="lt">e não sabia direito por quê.</div></div>
<div id="lg3" class="clip leg" data-start="6.45" data-duration="1.76" style="top:330px"><div class="mancha"></div><div class="lt">No dia em que a Muralha Maria caiu,</div></div>
<div id="lg4" class="clip leg" data-start="8.26" data-duration="0.80" style="top:330px"><div class="mancha"></div><div class="lt">o Grisha não fugiu.</div></div>
<div id="lg5" class="clip leg" data-start="9.11" data-duration="1.22" style="top:250px"><div class="mancha"></div><div class="lt">Correu na direção contrária,</div></div>
<div id="lg6" class="clip leg" data-start="10.38" data-duration="1.80" style="top:250px"><div class="mancha"></div><div class="lt">até a capela dos Reiss.</div></div>
<div id="lg7" class="clip leg" data-start="13.21" data-duration="0.67" style="top:330px"><div class="mancha"></div><div class="lt">Anos antes,</div></div>
<div id="lg8" class="clip leg" data-start="13.93" data-duration="1.18" style="top:330px"><div class="mancha"></div><div class="lt">o Kruger tinha dado a ele</div></div>
<div id="lg9" class="clip leg" data-start="15.16" data-duration="0.67" style="top:330px"><div class="mancha"></div><div class="lt">o Titã de Ataque,</div></div>
<div id="lg10" class="clip leg" data-start="15.88" data-duration="0.97" style="top:250px"><div class="mancha"></div><div class="lt">e uma missão:</div></div>
<div id="lg11" class="clip leg" data-start="16.97" data-duration="0.78" style="top:250px"><div class="mancha"></div><div class="lt">tomar o Titã Fundador</div></div>
<div id="lg12" class="clip leg" data-start="17.80" data-duration="1.21" style="top:250px"><div class="mancha"></div><div class="lt">da família real.</div></div>
<div id="lg13" class="clip leg" data-start="19.89" data-duration="1.25" style="top:330px"><div class="mancha"></div><div class="lt">Quem tinha esse poder</div></div>
<div id="lg14" class="clip leg" data-start="21.19" data-duration="1.21" style="top:330px"><div class="mancha"></div><div class="lt">era a Frieda Reiss.</div></div>
<div id="lg15" class="clip leg" data-start="22.45" data-duration="1.84" style="top:250px"><div class="mancha"></div><div class="lt">Ela podia salvar as muralhas,</div></div>
<div id="lg16" class="clip leg" data-start="24.34" data-duration="1.80" style="top:250px"><div class="mancha"></div><div class="lt">mas o juramento do primeiro rei</div></div>
<div id="lg17" class="clip leg" data-start="26.19" data-duration="0.85" style="top:250px"><div class="mancha"></div><div class="lt">proibia lutar.</div></div>
<div id="lg18" class="clip leg" data-start="27.09" data-duration="1.36" style="top:330px"><div class="mancha"></div><div class="lt">O Grisha implorou.</div></div>
<div id="lg19" class="clip leg" data-start="28.50" data-duration="0.39" style="top:330px"><div class="mancha"></div><div class="lt">Ela se transformou.</div></div>
<div id="lg20" class="clip leg" data-start="28.94" data-duration="1.50" style="top:330px"><div class="mancha"></div><div class="lt">Na caverna de cristal,</div></div>
<div id="lg21" class="clip leg" data-start="30.49" data-duration="0.99" style="top:250px"><div class="mancha"></div><div class="lt">ele a devorou,</div></div>
<div id="lg22" class="clip leg" data-start="31.53" data-duration="1.43" style="top:250px"><div class="mancha"></div><div class="lt">e matou os filhos do Rod.</div></div>
<div id="lg23" class="clip leg" data-start="33.97" data-duration="1.56" style="top:250px"><div class="mancha"></div><div class="lt">Link do meu Discord tá na bio.</div></div>
<div id="lg24" class="clip leg" data-start="35.58" data-duration="1.56" style="top:330px"><div class="mancha"></div><div class="lt">O filósofo Sartre escreveu</div></div>
<div id="lg25" class="clip leg" data-start="37.19" data-duration="1.49" style="top:330px"><div class="mancha"></div><div class="lt">que o homem está condenado</div></div>
<div id="lg26" class="clip leg" data-start="38.73" data-duration="0.88" style="top:250px"><div class="mancha"></div><div class="lt">a ser livre.</div></div>
<div id="lg27" class="clip leg" data-start="39.66" data-duration="0.45" style="top:250px"><div class="mancha"></div><div class="lt">O Grisha queria</div></div>
<div id="lg28" class="clip leg" data-start="40.16" data-duration="1.13" style="top:250px"><div class="mancha"></div><div class="lt">não ter escolha.</div></div>
<div id="lg29" class="clip leg" data-start="41.89" data-duration="1.78" style="top:330px"><div class="mancha"></div><div class="lt">E, de certo jeito, não teve.</div></div>
<div id="lg30" class="clip leg" data-start="43.72" data-duration="1.64" style="top:330px"><div class="mancha"></div><div class="lt">Ele parou ali, chorando.</div></div>
<div id="lg31" class="clip leg" data-start="45.41" data-duration="1.45" style="top:250px"><div class="mancha"></div><div class="lt">E dentro da memória dele</div></div>
<div id="lg32" class="clip leg" data-start="46.91" data-duration="2.23" style="top:250px"><div class="mancha"></div><div class="lt">estava o próprio filho, o Eren,</div></div>
<div id="lg33" class="clip leg" data-start="49.19" data-duration="-0.05" style="top:250px"><div class="mancha"></div><div class="lt">dizendo:</div></div>
<div id="lg34" class="clip leg" data-start="49.19" data-duration="0.95" style="top:250px"><div class="mancha"></div><div class="lt"><span class="quem">EREN:</span> “siga em frente.”</div></div>
<div id="lg35" class="clip leg" data-start="51.93" data-duration="2.47" style="top:250px"><div class="mancha"></div><div class="lt">Um pai que começou tudo pelo filho...</div></div>
<div id="lg36" class="clip leg" data-start="54.45" data-duration="1.55" style="top:250px"><div class="mancha"></div><div class="lt">empurrado pelo filho.</div></div>
<div id="lg37" class="clip leg" data-start="56.05" data-duration="0.70" style="top:250px"><div class="mancha"></div><div class="lt">Se você pudesse voltar</div></div>
<div id="lg38" class="clip leg" data-start="56.80" data-duration="0.87" style="top:250px"><div class="mancha"></div><div class="lt">e falar uma frase</div></div>
<div id="lg39" class="clip leg" data-start="57.72" data-duration="1.11" style="top:250px"><div class="mancha"></div><div class="lt">pra alguém do seu passado,</div></div>
<div id="lg40" class="clip leg" data-start="58.88" data-duration="0.64" style="top:250px"><div class="mancha"></div><div class="lt">qual seria?</div></div>
<div id="lg41" class="clip leg" data-start="59.57" data-duration="0.91" style="top:250px"><div class="mancha"></div><div class="lt">Comenta aí,</div></div>
<div id="lg42" class="clip leg" data-start="60.53" data-duration="1.01" style="top:250px"><div class="mancha"></div><div class="lt">e me segue pra mais.</div></div>
