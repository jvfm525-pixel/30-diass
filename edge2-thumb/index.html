<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/timing.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07040f; }
      #root { width: 100%; height: 100%; position: relative; }
      #c3d { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .t { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Archivo Black'; color: #fff; text-shadow: 0 8px 30px rgba(0,0,0,.9); -webkit-text-stroke: 10px #000; paint-order: stroke fill; }
      .vig { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.75) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <canvas id="c3d" width="1080" height="1920"></canvas>
      <div class="vig"></div>
      <div class="t" style="top:110px;font-size:84px;line-height:1.05">O FINAL DE<br>CADA PERSONAGEM</div>
      <div class="t" style="top:305px;font-size:104px;line-height:1;color:#4ff0ff;white-space:nowrap">EDGE<span style="color:#ff4fd8">RUNNERS</span> <span style="color:#ffe14d">2</span></div>
      <div class="t" style="top:1430px;font-size:76px;letter-spacing:.12em">❌❌❌❓✅✅✅</div>
      <div class="t" style="top:1580px;font-size:66px;line-height:1.08">QUEM VIVEU?<br>QUEM MORREU? 👀</div>
    </div>
    <script type="module" src="assets/edge3d.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
