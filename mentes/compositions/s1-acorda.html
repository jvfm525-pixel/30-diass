  function hfAlive(tl, p, dur, amp) {
    const st = { t: 0 }; amp = amp || 1;

      const k = Math.floor(st.t * 12);
      gsap.set('#' + p + '-rig', { x: (hfHash(k) - .5) * 2.4 * amp, y: (hfHash(k + 99) - .5) * 2.4 * amp });
