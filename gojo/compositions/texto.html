  <div class="tl1">Por que o</div><div class="tl2">GOJO</div><div class="tl3">FICOU PRESO</div><div class="tl1">tanto tempo?</div></div>
<div id="cap0" class="clip cap" data-start="5.03" data-duration="2.60">— SHIBUYA —</div>
<div id="cap1" class="clip cap" data-start="13.47" data-duration="2.60">— UM INSTANTE —</div>
<div id="cap2" class="clip cap" style="font-size:34px;letter-spacing:.2em" data-start="20.26" data-duration="2.60">— O REINO DA PRISÃO —</div>
<div id="cap3" class="clip cap" data-start="25.92" data-duration="2.60">— AS CHAVES —</div>
<div id="cap4" class="clip cap" data-start="35.34" data-duration="2.60">— O ANJO —</div>
<div id="cap5" class="clip cap" data-start="41.35" data-duration="2.60">— APEGO —</div>
<div id="lg1" class="clip leg" data-start="2.99" data-duration="0.68" style="top:250px"><div class="mancha"></div><div class="lt">que foi vencido</div></div>
<div id="lg2" class="clip leg" data-start="3.72" data-duration="1.00" style="top:250px"><div class="mancha"></div><div class="lt">por uma lembrança.</div></div>
<div id="lg3" class="clip leg" data-start="5.13" data-duration="1.50" style="top:330px"><div class="mancha"></div><div class="lt">Em Shibuya, o Gojo tinha acabado de derrotar</div></div>
<div id="lg4" class="clip leg" data-start="6.68" data-duration="0.88" style="top:330px"><div class="mancha"></div><div class="lt">centenas de maldições.</div></div>
<div id="lg5" class="clip leg" data-start="7.61" data-duration="1.17" style="top:330px"><div class="mancha"></div><div class="lt">Aí apareceu alguém</div></div>
<div id="lg6" class="clip leg" data-start="8.83" data-duration="1.23" style="top:250px"><div class="mancha"></div><div class="lt">com o rosto do Suguru Geto.</div></div>
<div id="lg7" class="clip leg" data-start="10.11" data-duration="0.85" style="top:250px"><div class="mancha"></div><div class="lt">O melhor amigo dele...</div></div>
<div id="lg8" class="clip leg" data-start="11.01" data-duration="1.61" style="top:250px"><div class="mancha"></div><div class="lt">que ele mesmo tinha matado.</div></div>
<div id="lg9" class="clip leg" data-start="13.57" data-duration="0.69" style="top:330px"><div class="mancha"></div><div class="lt">Por um instante,</div></div>
<div id="lg10" class="clip leg" data-start="14.31" data-duration="0.61" style="top:330px"><div class="mancha"></div><div class="lt">a cabeça dele voltou</div></div>
<div id="lg11" class="clip leg" data-start="14.97" data-duration="0.85" style="top:330px"><div class="mancha"></div><div class="lt">pros anos de escola</div></div>
<div id="lg12" class="clip leg" data-start="15.87" data-duration="0.77" style="top:330px"><div class="mancha"></div><div class="lt">ao lado do amigo.</div></div>
<div id="lg13" class="clip leg" data-start="16.69" data-duration="0.81" style="top:250px"><div class="mancha"></div><div class="lt">E esse instante bastou.</div></div>
<div id="lg14" class="clip leg" data-start="17.55" data-duration="1.69" style="top:250px"><div class="mancha"></div><div class="lt">O Reino da Prisão se fechou.</div></div>
<div id="lg15" class="clip leg" data-start="20.36" data-duration="1.14" style="top:330px"><div class="mancha"></div><div class="lt">Uma caixa feita dos restos</div></div>
<div id="lg16" class="clip leg" data-start="21.55" data-duration="0.63" style="top:330px"><div class="mancha"></div><div class="lt">de um monge, o Genshin.</div></div>
<div id="lg17" class="clip leg" data-start="22.23" data-duration="0.59" style="top:330px"><div class="mancha"></div><div class="lt">Lá dentro,</div></div>
<div id="lg18" class="clip leg" data-start="22.87" data-duration="0.77" style="top:250px"><div class="mancha"></div><div class="lt">nem o Gojo consegue usar</div></div>
<div id="lg19" class="clip leg" data-start="23.69" data-duration="0.83" style="top:250px"><div class="mancha"></div><div class="lt">energia amaldiçoada.</div></div>
<div id="lg20" class="clip leg" data-start="26.02" data-duration="1.81" style="top:330px"><div class="mancha"></div><div class="lt">Mas por que ele ficou tanto tempo lá?</div></div>
<div id="lg21" class="clip leg" data-start="27.89" data-duration="0.84" style="top:330px"><div class="mancha"></div><div class="lt">Só duas ferramentas</div></div>
<div id="lg22" class="clip leg" data-start="28.78" data-duration="1.48" style="top:250px"><div class="mancha"></div><div class="lt">abriam a porta de trás da prisão:</div></div>
<div id="lg23" class="clip leg" data-start="30.31" data-duration="1.06" style="top:250px"><div class="mancha"></div><div class="lt">a Lança Invertida do Céu</div></div>
<div id="lg24" class="clip leg" data-start="31.42" data-duration="0.93" style="top:250px"><div class="mancha"></div><div class="lt">e a Corda Negra.</div></div>
<div id="lg25" class="clip leg" data-start="32.41" data-duration="1.12" style="top:250px"><div class="mancha"></div><div class="lt">E as duas tinham sumido...</div></div>
<div id="lg26" class="clip leg" data-start="33.58" data-duration="1.24" style="top:250px"><div class="mancha"></div><div class="lt">nas mãos do próprio Gojo.</div></div>
<div id="lg27" class="clip leg" data-start="35.44" data-duration="0.83" style="top:330px"><div class="mancha"></div><div class="lt">A saída foi o Anjo,</div></div>
<div id="lg28" class="clip leg" data-start="36.32" data-duration="0.98" style="top:330px"><div class="mancha"></div><div class="lt">uma feiticeira com uma técnica</div></div>
<div id="lg29" class="clip leg" data-start="37.35" data-duration="1.43" style="top:330px"><div class="mancha"></div><div class="lt">que apaga qualquer técnica.</div></div>
<div id="lg30" class="clip leg" data-start="39.52" data-duration="1.52" style="top:250px"><div class="mancha"></div><div class="lt">Link do meu Discord tá na bio.</div></div>
<div id="lg31" class="clip leg" data-start="41.45" data-duration="0.53" style="top:330px"><div class="mancha"></div><div class="lt">E o budismo,</div></div>
<div id="lg32" class="clip leg" data-start="42.03" data-duration="0.81" style="top:330px"><div class="mancha"></div><div class="lt">a religião daquele monge,</div></div>
<div id="lg33" class="clip leg" data-start="42.89" data-duration="1.44" style="top:330px"><div class="mancha"></div><div class="lt">ensina que o que prende a gente</div></div>
<div id="lg34" class="clip leg" data-start="44.38" data-duration="0.60" style="top:250px"><div class="mancha"></div><div class="lt">não são correntes.</div></div>
<div id="lg35" class="clip leg" data-start="45.03" data-duration="0.76" style="top:250px"><div class="mancha"></div><div class="lt">É o apego.</div></div>
<div id="lg36" class="clip leg" data-start="45.84" data-duration="1.15" style="top:250px"><div class="mancha"></div><div class="lt">O Gojo podia vencer qualquer um...</div></div>
<div id="lg37" class="clip leg" data-start="47.04" data-duration="1.86" style="top:250px"><div class="mancha"></div><div class="lt">menos o que sentia pelo amigo.</div></div>
<div id="lg38" class="clip leg" data-start="50.06" data-duration="0.78" style="top:250px"><div class="mancha"></div><div class="lt">Na história, foram semanas.</div></div>
<div id="lg39" class="clip leg" data-start="50.89" data-duration="0.72" style="top:250px"><div class="mancha"></div><div class="lt">Na vida real,</div></div>
<div id="lg40" class="clip leg" data-start="51.66" data-duration="0.97" style="top:250px"><div class="mancha"></div><div class="lt">foram mais de três anos,</div></div>
<div id="lg41" class="clip leg" data-start="52.68" data-duration="1.36" style="top:250px"><div class="mancha"></div><div class="lt">e cento e trinta e um capítulos.</div></div>
<div id="lg42" class="clip leg" data-start="54.09" data-duration="1.81" style="top:250px"><div class="mancha"></div><div class="lt">Se você pudesse rever alguém do seu passado</div></div>
<div id="lg43" class="clip leg" data-start="55.95" data-duration="0.54" style="top:250px"><div class="mancha"></div><div class="lt">por um instante...</div></div>
<div id="lg44" class="clip leg" data-start="56.54" data-duration="0.51" style="top:250px"><div class="mancha"></div><div class="lt">quem seria?</div></div>
<div id="lg45" class="clip leg" data-start="57.10" data-duration="0.75" style="top:250px"><div class="mancha"></div><div class="lt">Comenta aí,</div></div>
<div id="lg46" class="clip leg" data-start="57.91" data-duration="1.48" style="top:250px"><div class="mancha"></div><div class="lt">e me segue pra mais.</div></div>
