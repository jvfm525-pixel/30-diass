<div id="cap0" class="clip cap" data-start="6.02" data-duration="2.60">— SHIBUYA —</div>
<div id="cap1" class="clip cap" data-start="16.50" data-duration="2.60">— UM INSTANTE —</div>
<div id="cap2" class="clip cap" style="font-size:34px;letter-spacing:.2em" data-start="24.30" data-duration="2.60">— O REINO DA PRISÃO —</div>
<div id="cap3" class="clip cap" data-start="31.02" data-duration="2.60">— AS CHAVES —</div>
<div id="cap4" class="clip cap" data-start="42.24" data-duration="2.60">— O ANJO —</div>
<div id="cap5" class="clip cap" data-start="50.38" data-duration="2.60">— APEGO —</div>
<div id="lg1" class="clip leg" data-start="3.98" data-duration="0.82" style="top:250px"><div class="mancha"></div><div class="lt">que foi vencido</div></div>
<div id="lg2" class="clip leg" data-start="4.85" data-duration="1.22" style="top:250px"><div class="mancha"></div><div class="lt">por uma lembrança.</div></div>
<div id="lg3" class="clip leg" data-start="6.12" data-duration="2.09" style="top:330px"><div class="mancha"></div><div class="lt">Em Shibuya, o Gojo tinha acabado de derrotar</div></div>
<div id="lg4" class="clip leg" data-start="8.26" data-duration="1.29" style="top:330px"><div class="mancha"></div><div class="lt">centenas de maldições.</div></div>
<div id="lg5" class="clip leg" data-start="9.60" data-duration="1.47" style="top:250px"><div class="mancha"></div><div class="lt">Aí apareceu alguém</div></div>
<div id="lg6" class="clip leg" data-start="11.12" data-duration="1.61" style="top:250px"><div class="mancha"></div><div class="lt">com o rosto do Suguru Geto.</div></div>
<div id="lg7" class="clip leg" data-start="12.78" data-duration="1.04" style="top:250px"><div class="mancha"></div><div class="lt">O melhor amigo dele...</div></div>
<div id="lg8" class="clip leg" data-start="13.87" data-duration="1.73" style="top:250px"><div class="mancha"></div><div class="lt">que ele mesmo tinha matado.</div></div>
<div id="lg9" class="clip leg" data-start="16.60" data-duration="0.83" style="top:330px"><div class="mancha"></div><div class="lt">Por um instante,</div></div>
<div id="lg10" class="clip leg" data-start="17.48" data-duration="0.66" style="top:330px"><div class="mancha"></div><div class="lt">a cabeça dele voltou</div></div>
<div id="lg11" class="clip leg" data-start="18.19" data-duration="1.07" style="top:330px"><div class="mancha"></div><div class="lt">pros anos de escola</div></div>
<div id="lg12" class="clip leg" data-start="19.31" data-duration="0.93" style="top:250px"><div class="mancha"></div><div class="lt">ao lado do amigo.</div></div>
<div id="lg13" class="clip leg" data-start="20.29" data-duration="0.78" style="top:250px"><div class="mancha"></div><div class="lt">E esse instante bastou.</div></div>
<div id="lg14" class="clip leg" data-start="21.12" data-duration="2.16" style="top:250px"><div class="mancha"></div><div class="lt">O Reino da Prisão se fechou.</div></div>
<div id="lg15" class="clip leg" data-start="24.40" data-duration="1.39" style="top:330px"><div class="mancha"></div><div class="lt">Uma caixa feita dos restos</div></div>
<div id="lg16" class="clip leg" data-start="25.84" data-duration="0.79" style="top:330px"><div class="mancha"></div><div class="lt">de um monge, o Genshin.</div></div>
<div id="lg17" class="clip leg" data-start="26.68" data-duration="0.65" style="top:330px"><div class="mancha"></div><div class="lt">Lá dentro,</div></div>
<div id="lg18" class="clip leg" data-start="27.38" data-duration="1.02" style="top:250px"><div class="mancha"></div><div class="lt">nem o Gojo consegue usar</div></div>
<div id="lg19" class="clip leg" data-start="28.45" data-duration="0.97" style="top:250px"><div class="mancha"></div><div class="lt">energia amaldiçoada.</div></div>
<div id="lg20" class="clip leg" data-start="31.12" data-duration="2.19" style="top:330px"><div class="mancha"></div><div class="lt">Mas por que ele ficou tanto tempo lá?</div></div>

<div id="lg25" class="clip leg" data-start="38.98" data-duration="1.40" style="top:250px"><div class="mancha"></div><div class="lt">E as duas tinham sumido...</div></div>

<div id="lg27" class="clip leg" data-start="42.34" data-duration="1.13" style="top:330px"><div class="mancha"></div><div class="lt">A saída foi o Anjo,</div></div>
<div id="lg28" class="clip leg" data-start="43.52" data-duration="1.35" style="top:330px"><div class="mancha"></div><div class="lt">uma feiticeira com uma técnica</div></div>
<div id="lg29" class="clip leg" data-start="44.92" data-duration="1.96" style="top:250px"><div class="mancha"></div><div class="lt">que apaga qualquer técnica.</div></div>
<div id="lg30" class="clip leg" data-start="47.56" data-duration="1.31" style="top:250px"><div class="mancha"></div><div class="lt">Quer aprender a fazer esses vídeos?</div></div>
<div id="lg31" class="clip leg" data-start="48.92" data-duration="1.51" style="top:250px"><div class="mancha"></div><div class="lt">Link do meu Discord na bio.</div></div>
<div id="lg32" class="clip leg" data-start="50.48" data-duration="0.58" style="top:330px"><div class="mancha"></div><div class="lt">E o budismo,</div></div>
<div id="lg33" class="clip leg" data-start="51.11" data-duration="1.00" style="top:330px"><div class="mancha"></div><div class="lt">a religião daquele monge,</div></div>
<div id="lg34" class="clip leg" data-start="52.16" data-duration="1.67" style="top:330px"><div class="mancha"></div><div class="lt">ensina que o que prende a gente</div></div>
<div id="lg35" class="clip leg" data-start="53.88" data-duration="0.66" style="top:250px"><div class="mancha"></div><div class="lt">não são correntes.</div></div>
<div id="lg36" class="clip leg" data-start="54.59" data-duration="0.87" style="top:250px"><div class="mancha"></div><div class="lt">É o apego.</div></div>
<div id="lg37" class="clip leg" data-start="55.51" data-duration="1.68" style="top:250px"><div class="mancha"></div><div class="lt">O Gojo podia vencer qualquer um...</div></div>

<div id="lg40" class="clip leg" data-start="61.66" data-duration="0.88" style="top:250px"><div class="mancha"></div><div class="lt">Na vida real,</div></div>
<div id="lg41" class="clip leg" data-start="62.59" data-duration="1.57" style="top:250px"><div class="mancha"></div><div class="lt">foram mais de três anos,</div></div>
<div id="lg42" class="clip leg" data-start="64.21" data-duration="1.34" style="top:250px"><div class="mancha"></div><div class="lt">e cento e trinta e um capítulos.</div></div>

<div id="lg44" class="clip leg" data-start="68.14" data-duration="0.74" style="top:250px"><div class="mancha"></div><div class="lt">por um instante...</div></div>
<div id="lg45" class="clip leg" data-start="68.93" data-duration="0.52" style="top:250px"><div class="mancha"></div><div class="lt">quem seria?</div></div>
<div id="lg46" class="clip leg" data-start="69.50" data-duration="0.79" style="top:250px"><div class="mancha"></div><div class="lt">Comenta aí,</div></div>
<div id="lg47" class="clip leg" data-start="70.34" data-duration="1.75" style="top:250px"><div class="mancha"></div><div class="lt">e me segue pra mais.</div></div>
