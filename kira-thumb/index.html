<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/timing.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05060c; }
      #root { width: 100%; height: 100%; position: relative; }
      #c3d { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .t { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Archivo Black', sans-serif; line-height: 1.02; }
      .t1 { color: #f6f1e8; -webkit-text-stroke: 12px #06060e; paint-order: stroke fill; text-shadow: 0 10px 30px rgba(0,0,0,.9); }
      .t2 { color: #ffc65a; -webkit-text-stroke: 15px #140a00; paint-order: stroke fill; text-shadow: 0 0 50px rgba(255,198,90,.75), 0 12px 34px rgba(0,0,0,.95); }
      .topshade { position: absolute; left: 0; right: 0; top: 0; height: 700px; background: linear-gradient(180deg, rgba(4,4,12,.82) 0%, rgba(4,4,12,0) 100%); }
      .tag { position: absolute; font-family: 'Archivo Black', sans-serif; font-size: 44px; color: #fff; background: linear-gradient(180deg, #ff4a5a, #c81e2a); padding: 8px 24px 12px; border: 6px solid #fff;
        box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 30px rgba(255,59,78,.6); }
      .band { position: absolute; left: 0; right: 0; top: 1720px; height: 140px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(90deg, rgba(6,6,14,0) 0%, rgba(6,6,14,.92) 16%, rgba(6,6,14,.92) 84%, rgba(6,6,14,0) 100%); border-top: 4px solid #c4adff; border-bottom: 4px solid #c4adff; }
      .band span { font-family: 'Archivo Black', sans-serif; font-size: 70px; color: #fff; letter-spacing: .04em; text-shadow: 0 0 22px rgba(196,173,255,.6); }
      .band b { color: #c4adff; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 48%, rgba(4,4,10,.7) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1080" data-height="1920">
      <canvas id="c3d" width="1080" height="1920"></canvas>
      <div class="vig"></div>
      <div class="topshade"></div>
      <div class="t t1" style="top:80px;font-size:104px">POR QUE O KIRA<br>QUERIA SER</div>
      <div class="t t2" style="top:300px;font-size:178px">NORMAL?</div>
      <div class="tag" style="left:44px;top:540px;transform:rotate(-3deg)">💣 15 ANOS SEM SER PEGO</div>
      <div class="band"><span>⭐ <b>JOJO</b> PARTE 4</span></div>
    </div>
    <script type="module" src="assets/kira3d.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
