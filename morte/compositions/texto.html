<div id="cap0" class="clip cap" data-start="9.98" data-duration="2.60">— A REGRA —</div>
<div id="cap1" class="clip cap" style="font-size:34px;letter-spacing:.2em" data-start="24.64" data-duration="2.60">— OS CAVALEIROS —</div>

<div id="cap7" class="clip cap" data-start="102.97" data-duration="2.60">— O FIM —</div>
<div id="lg1" class="clip leg" data-start="5.24" data-duration="3.44" style="top:250px"><div class="mancha"></div><div class="lt">e ele passou a história inteira escondido do lado do Denji.</div></div>
<div id="lg2" class="clip leg" data-start="8.73" data-duration="1.30" style="top:250px"><div class="mancha"></div><div class="lt">Spoiler do mangá, hein.</div></div>
<div id="lg3" class="clip leg" data-start="10.08" data-duration="2.03" style="top:330px"><div class="mancha"></div><div class="lt">A regra desse mundo é simples:</div></div>
<div id="lg4" class="clip leg" data-start="12.16" data-duration="2.41" style="top:330px"><div class="mancha"></div><div class="lt">quanto mais as pessoas têm medo de alguma coisa,</div></div>
<div id="lg5" class="clip leg" data-start="14.62" data-duration="1.87" style="top:250px"><div class="mancha"></div><div class="lt">mais forte fica o demônio dela.</div></div>
<div id="lg6" class="clip leg" data-start="16.54" data-duration="1.88" style="top:250px"><div class="mancha"></div><div class="lt">Tem gente que não tem medo de arma,</div></div>
<div id="lg7" class="clip leg" data-start="18.47" data-duration="1.42" style="top:250px"><div class="mancha"></div><div class="lt">de escuro ou de altura.</div></div>
<div id="lg8" class="clip leg" data-start="19.94" data-duration="3.35" style="top:250px"><div class="mancha"></div><div class="lt">Mas todo mundo, em qualquer lugar e em qualquer época,</div></div>
<div id="lg9" class="clip leg" data-start="23.34" data-duration="1.35" style="top:250px"><div class="mancha"></div><div class="lt">tem medo de morrer.</div></div>
<div id="lg10" class="clip leg" data-start="24.74" data-duration="4.28" style="top:330px"><div class="mancha"></div><div class="lt">Por isso, o Demônio da Morte é o demônio mais forte que existe.</div></div>
<div id="lg11" class="clip leg" data-start="29.07" data-duration="1.81" style="top:250px"><div class="mancha"></div><div class="lt">Ela é a irmã mais velha da Makima,</div></div>
<div id="lg12" class="clip leg" data-start="30.93" data-duration="1.75" style="top:250px"><div class="mancha"></div><div class="lt">da Yoru e do Demônio da Fome:</div></div>

<div id="lg14" class="clip leg" data-start="35.04" data-duration="2.51" style="top:330px"><div class="mancha"></div><div class="lt">E a profecia de Nostradamus diz que,</div></div>
<div id="lg15" class="clip leg" data-start="37.60" data-duration="2.02" style="top:250px"><div class="mancha"></div><div class="lt">em julho de 1999,</div></div>
<div id="lg16" class="clip leg" data-start="39.67" data-duration="1.20" style="top:250px"><div class="mancha"></div><div class="lt">ela vai descer à Terra,</div></div>
<div id="lg17" class="clip leg" data-start="40.92" data-duration="1.38" style="top:250px"><div class="mancha"></div><div class="lt">acabar com a humanidade</div></div>
<div id="lg18" class="clip leg" data-start="42.35" data-duration="2.14" style="top:250px"><div class="mancha"></div><div class="lt">e começar a Era dos Demônios.</div></div>
<div id="lg19" class="clip leg" data-start="44.54" data-duration="2.85" style="top:250px"><div class="mancha"></div><div class="lt">E o pior: esse poder acorda sozinho.</div></div>

<div id="lg22" class="clip leg" data-start="53.37" data-duration="1.43" style="top:250px"><div class="mancha"></div><div class="lt">Quer aprender a fazer esses vídeos?</div></div>

<div id="lg24" class="clip leg" data-start="56.48" data-duration="2.54" style="top:330px"><div class="mancha"></div><div class="lt">Agora vem a parte que ninguém esperava.</div></div>
<div id="lg25" class="clip leg" data-start="59.07" data-duration="2.95" style="top:250px"><div class="mancha"></div><div class="lt">Ela estava na escola do Denji o tempo todo.</div></div>
<div id="lg26" class="clip leg" data-start="62.07" data-duration="0.80" style="top:250px"><div class="mancha"></div><div class="lt">Era a Fami,</div></div>
<div id="lg27" class="clip leg" data-start="62.92" data-duration="1.87" style="top:250px"><div class="mancha"></div><div class="lt">a menina calma que vivia comendo</div></div>
<div id="lg28" class="clip leg" data-start="64.84" data-duration="1.78" style="top:250px"><div class="mancha"></div><div class="lt">e dizia ser o Demônio da Fome.</div></div>
<div id="lg29" class="clip leg" data-start="66.67" data-duration="0.81" style="top:330px"><div class="mancha"></div><div class="lt">Ela mata na hora,</div></div>

<div id="lg36" class="clip leg" data-start="78.17" data-duration="2.15" style="top:330px"><div class="mancha"></div><div class="lt">Mas ela não queria acabar com a humanidade.</div></div>

<div id="lg42" class="clip leg" data-start="90.24" data-duration="1.25" style="top:330px"><div class="mancha"></div><div class="lt">E, se um dia morresse,</div></div>

<div id="lg48" class="clip leg" data-start="103.07" data-duration="2.03" style="top:330px"><div class="mancha"></div><div class="lt">No fim, o Pochita devorou a Morte</div></div>
