  <div id="root" data-composition-id="texto" data-width="1080" data-height="1920">
<div id="titulo" class="clip titulo" data-start="0.75" data-duration="2.16">
  <div class="tl1">Como o</div><div class="tl2">LIGHT</div><div class="tl1">perdeu pros</div><div class="tl3">DOIS?</div></div>
<div id="cap0" class="clip cap" data-start="11.18" data-duration="2.60">— O HERDEIRO DIVIDIDO —</div>
<div id="cap1" class="clip cap" data-start="26.04" data-duration="2.60">— O ERRO DO DEUS —</div>
<div id="cap2" class="clip cap" data-start="47.38" data-duration="2.60">— O SACRIFÍCIO —</div>
<div id="cap3" class="clip cap" data-start="60.08" data-duration="2.60">— O CADERNO FALSO —</div>
<div id="cap4" class="clip cap" data-start="71.75" data-duration="2.60">— YELLOW BOX —</div>
<div id="lg2" class="clip leg" data-start="4.94" data-duration="3.74" style="top:250px"><div class="mancha"></div><div class="lt">A resposta é que ele nunca enfrentou os dois ao mesmo tempo...</div></div>
<div id="lg3" class="clip leg" data-start="8.73" data-duration="1.77" style="top:250px"><div class="mancha"></div><div class="lt">até ser tarde demais.</div></div>
<div id="lg4" class="clip leg" data-start="11.28" data-duration="2.07" style="top:330px"><div class="mancha"></div><div class="lt">O L deixou dois herdeiros.</div></div>
<div id="lg5" class="clip leg" data-start="13.40" data-duration="1.48" style="top:330px"><div class="mancha"></div><div class="lt">O Near pensava como o L,</div></div>
<div id="lg6" class="clip leg" data-start="14.93" data-duration="0.90" style="top:250px"><div class="mancha"></div><div class="lt">frio e paciente.</div></div>
<div id="lg7" class="clip leg" data-start="15.88" data-duration="2.45" style="top:250px"><div class="mancha"></div><div class="lt">O Mello agia como o L,</div></div>
<div id="lg8" class="clip leg" data-start="18.38" data-duration="1.32" style="top:250px"><div class="mancha"></div><div class="lt">impulsivo e corajoso.</div></div>
<div id="lg9" class="clip leg" data-start="19.75" data-duration="3.58" style="top:250px"><div class="mancha"></div><div class="lt">Separados, nenhum dos dois vencia o Light.</div></div>
<div id="lg10" class="clip leg" data-start="23.38" data-duration="1.79" style="top:250px"><div class="mancha"></div><div class="lt">E o próprio Near admitiu isso.</div></div>
<div id="lg11" class="clip leg" data-start="26.14" data-duration="1.49" style="top:330px"><div class="mancha"></div><div class="lt">Então, onde o Light errou?</div></div>
<div id="lg12" class="clip leg" data-start="27.68" data-duration="1.00" style="top:330px"><div class="mancha"></div><div class="lt">Ele confiou demais.</div></div>
<div id="lg13" class="clip leg" data-start="28.73" data-duration="2.21" style="top:250px"><div class="mancha"></div><div class="lt">Pra não sujar as mãos,</div></div>
<div id="lg14" class="clip leg" data-start="30.99" data-duration="0.95" style="top:250px"><div class="mancha"></div><div class="lt">entregou o caderno ao Mikami,</div></div>
<div id="lg15" class="clip leg" data-start="31.99" data-duration="1.12" style="top:250px"><div class="mancha"></div><div class="lt">um fiel que agia sozinho.</div></div>
<div id="lg16" class="clip leg" data-start="33.16" data-duration="2.63" style="top:250px"><div class="mancha"></div><div class="lt">Pela primeira vez, o plano do Light</div></div>
<div id="lg17" class="clip leg" data-start="35.84" data-duration="2.05" style="top:250px"><div class="mancha"></div><div class="lt">dependia de alguém que ele não controlava.</div></div>
<div id="lg18" class="clip leg" data-start="39.58" data-duration="1.47" style="top:250px"><div class="mancha"></div><div class="lt">Rapidinho: no meu servidor do Discord</div></div>
<div id="lg19" class="clip leg" data-start="41.10" data-duration="2.49" style="top:250px"><div class="mancha"></div><div class="lt">tem keys aleatórias, vários outros itens,</div></div>
<div id="lg20" class="clip leg" data-start="43.64" data-duration="1.79" style="top:250px"><div class="mancha"></div><div class="lt">e eu ainda ensino a fazer vídeos como este.</div></div>
<div id="lg21" class="clip leg" data-start="45.48" data-duration="1.55" style="top:250px"><div class="mancha"></div><div class="lt">O link tá na bio.</div></div>
<div id="lg22" class="clip leg" data-start="47.48" data-duration="1.41" style="top:330px"><div class="mancha"></div><div class="lt">Aí entrou o Mello.</div></div>
<div id="lg23" class="clip leg" data-start="48.94" data-duration="0.94" style="top:330px"><div class="mancha"></div><div class="lt">Ele sequestrou a Takada,</div></div>
<div id="lg24" class="clip leg" data-start="49.93" data-duration="1.28" style="top:330px"><div class="mancha"></div><div class="lt">a porta-voz do Kira,</div></div>
<div id="lg25" class="clip leg" data-start="51.26" data-duration="1.23" style="top:250px"><div class="mancha"></div><div class="lt">e forçou o Light a agir.</div></div>
<div id="lg26" class="clip leg" data-start="52.54" data-duration="1.38" style="top:250px"><div class="mancha"></div><div class="lt">O Mello morreu nesse dia...</div></div>
<div id="lg27" class="clip leg" data-start="53.97" data-duration="1.46" style="top:250px"><div class="mancha"></div><div class="lt">mas obrigou o Mikami</div></div>
<div id="lg28" class="clip leg" data-start="55.48" data-duration="1.35" style="top:250px"><div class="mancha"></div><div class="lt">a ir buscar o caderno verdadeiro,</div></div>
<div id="lg29" class="clip leg" data-start="56.88" data-duration="2.20" style="top:250px"><div class="mancha"></div><div class="lt">escondido num cofre de banco.</div></div>
<div id="lg30" class="clip leg" data-start="60.18" data-duration="2.05" style="top:330px"><div class="mancha"></div><div class="lt">Foi tudo que o Near precisava.</div></div>
<div id="lg31" class="clip leg" data-start="62.28" data-duration="1.23" style="top:330px"><div class="mancha"></div><div class="lt">Ele seguiu o Mikami,</div></div>
<div id="lg32" class="clip leg" data-start="63.56" data-duration="1.01" style="top:250px"><div class="mancha"></div><div class="lt">achou o caderno</div></div>
<div id="lg33" class="clip leg" data-start="64.62" data-duration="2.11" style="top:250px"><div class="mancha"></div><div class="lt">e trocou as páginas por falsas.</div></div>
<div id="lg34" class="clip leg" data-start="66.78" data-duration="1.37" style="top:250px"><div class="mancha"></div><div class="lt">No galpão Yellow Box,</div></div>
<div id="lg35" class="clip leg" data-start="68.20" data-duration="2.48" style="top:250px"><div class="mancha"></div><div class="lt">o Light esperou os nomes serem escritos...</div></div>
<div id="lg36" class="clip leg" data-start="70.73" data-duration="0.60" style="top:250px"><div class="mancha"></div><div class="lt">e ninguém morreu.</div></div>
<div id="lg37" class="clip leg" data-start="71.85" data-duration="0.99" style="top:330px"><div class="mancha"></div><div class="lt">O Light riu,</div></div>
<div id="lg38" class="clip leg" data-start="72.89" data-duration="0.49" style="top:330px"><div class="mancha"></div><div class="lt">tentou fugir,</div></div>
<div id="lg39" class="clip leg" data-start="73.43" data-duration="0.58" style="top:330px"><div class="mancha"></div><div class="lt">implorou.</div></div>
<div id="lg40" class="clip leg" data-start="74.06" data-duration="1.95" style="top:330px"><div class="mancha"></div><div class="lt">No fim, o Ryuk escreveu o nome dele,</div></div>
<div id="lg41" class="clip leg" data-start="76.06" data-duration="2.16" style="top:250px"><div class="mancha"></div><div class="lt">como tinha prometido no primeiro dia.</div></div>
<div id="lg42" class="clip leg" data-start="79.88" data-duration="1.84" style="top:250px"><div class="mancha"></div><div class="lt">O Light venceu o Near.</div></div>
<div id="lg43" class="clip leg" data-start="81.77" data-duration="1.38" style="top:250px"><div class="mancha"></div><div class="lt">Venceu o Mello.</div></div>
<div id="lg44" class="clip leg" data-start="83.20" data-duration="2.33" style="top:250px"><div class="mancha"></div><div class="lt">Mas perdeu pros dois juntos.</div></div>
